name: Build

on:
  workflow_dispatch:
  push:
    branches: [ '2.X' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GIT_BRANCH: ${{ github.ref_name }}
      GIT_COMMIT: ${{ github.sha }}
      BUILD_ID: ${{ github.run_number }}
    steps:
      - name: Clone project
        uses: actions/checkout@v6

      - name: Install JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          check-latest: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run build with Gradle Wrapper
        run: chmod +x ./gradlew && ./gradlew clean build --refresh-dependencies

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}-build.${{ github.run_number }}
          name: ZNPCsPlus-Modern ${{ github.ref_name }} build \#${{ github.run_number }}
          generate_release_notes: true
          files: plugin/build/libs/ZNPCsPlus-Modern.jar
