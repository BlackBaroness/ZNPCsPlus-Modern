name: Build

on:
  workflow_dispatch:
  push:
    branches: [ '2.X' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GIT_BRANCH: ${{ github.ref_name }}
      GIT_COMMIT: ${{ github.sha }}
      BUILD_ID: ${{ github.run_number }}
    steps:
      - name: Clone project
        uses: actions/checkout@v7

      - name: Install JDK
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          check-latest: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run build with Gradle Wrapper
        run: chmod +x ./gradlew && ./gradlew clean build --refresh-dependencies

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}-build.${{ github.run_number }}
          name: 'Build #${{ github.run_number }}'
          generate_release_notes: true
          body: |
            # ❓ What file to choose?
            - For 1.16.* or 1.17.*, pick ZNPCsPlus-Modern-1_16.jar
            - For 1.18.* or higher, pick ZNPCsPlus-Modern-1_18.jar
          files: |
            plugin-1_16/build/libs/ZNPCsPlus-Modern-1_16.jar
            plugin-1_18/build/libs/ZNPCsPlus-Modern-1_18.jar
